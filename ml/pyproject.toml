[project]
name = "vernacular-ml"
version = "0.1.0"
description = "Training data and models for Vernacular machine translation (phase 3)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["sacrebleu>=2.4,<3"]

[project.scripts]
vernacular-corpus = "vernacular_ml.corpus:main"
vernacular-train = "vernacular_ml.train:main"
vernacular-benchmark = "vernacular_ml.benchmark:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.115", "httpx>=0.27"]
# The base model's runtime, for training and serving.
model = ["torch>=2.5", "transformers>=4.57", "peft>=0.17", "accelerate>=1.0"]
# Fine-tuning (P3-02b): a GPU host only, `uv run --group train vernacular-train ...`.
train = [{ include-group = "model" }, "datasets>=3"]
# The translation service (P3-03): `uv run --group serve uvicorn --factory vernacular_ml.service:from_env`.
serve = [{ include-group = "model" }, "fastapi>=0.115", "uvicorn>=0.32"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vernacular_ml"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
