name: vernacular

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vernacular
      POSTGRES_PASSWORD: vernacular
      POSTGRES_DB: vernacular
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vernacular -d vernacular"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
