[project]
name = "vernacular-client"
version = "0.1.0"
description = "Python client for the Vernacular API: human-verified words and phrases in Zambian languages."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "attrs>=23",
  "python-dateutil>=2.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vernacular"]

[tool.ruff]
line-length = 110
extend-exclude = ["vernacular/_api"]
