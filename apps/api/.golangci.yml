# golangci-lint v2. Run with `make lint`.
version: "2"

run:
  timeout: 3m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - dupl        # copy-pasted blocks
    - goconst     # repeated string literals that should be constants
    - gocyclo     # functions that do too much
    - revive      # style and naming
    - bodyclose
    - errorlint   # wrap and compare errors correctly
    - misspell
    - nilerr
    - noctx
    - unconvert
    - unparam
  settings:
    dupl:
      threshold: 100
    gocyclo:
      min-complexity: 15
    goconst:
      min-occurrences: 3
    misspell:
      locale: UK
  exclusions:
    generated: strict # skips internal/gen and */dbgen ("Code generated ... DO NOT EDIT")
    rules:
      - path: _test\.go
        linters: [dupl, goconst]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/wamunyima3/vernacular
