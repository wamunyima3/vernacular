openapi: 3.0.3
info:
  title: Vernacular API
  version: 0.1.0
  summary: Verified words, phrases and translations for Zambian languages.
  description: |
    Every item the API returns says where it came from and who checked it.
    Only items accepted by two independent native-speaker reviewers are `verified`,
    and only verified items are returned by default.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: system
  - name: languages
  - name: accounts
  - name: sources
  - name: contributions
  - name: review
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database readiness
      tags: [system]
      responses:
        "200":
          description: Service and database are reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          $ref: "#/components/responses/Error"
  /v1/languages:
    get:
      operationId: listLanguages
      summary: Supported and planned languages
      description: Languages in rollout order. `status` is `active` once the language serves data.
      tags: [languages]
      responses:
        "200":
          description: All languages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageList" }
        default:
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in user, with role and review approvals
      description: Used by the web tools. Requires a session token from sign-in.
      tags: [accounts]
      security:
        - session: []
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/credit:
    put:
      operationId: setCredit
      summary: Choose whether to be credited by name
      description: |
        Consent to appear on the public contributors page (CON-5, NFR-6). When it was given
        is recorded; turning it off removes the name at once.
      tags: [accounts]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credited]
              properties:
                credited: { type: boolean }
      responses:
        "204":
          description: Saved
        default:
          $ref: "#/components/responses/Error"
  /v1/contributions:
    post:
      operationId: createContribution
      summary: Propose a word (contributors)
      description: |
        Adds an entry and sense, and optionally an example, as `sourced` and queues them for
        blind review (CON-1, US-18). If the word and meaning already exist, the contribution
        is recorded as agreement with them instead.
      tags: [contributions]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContributionInput" }
      responses:
        "201":
          description: Recorded and queued for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contribution" }
        default:
          $ref: "#/components/responses/Error"
  /v1/review/next:
    get:
      operationId: getNextReview
      summary: The next concept to review (reviewers)
      description: |
        One English meaning with every pending candidate for it in the language, in random
        order and without provider names or other reviewers' decisions (CON-3, DQ-4, AI-4).
        Quick confirms come first, then standard, then full review (AI-3). Never includes
        items the reviewer wrote or has already reviewed. `204` when nothing is left.
      tags: [review]
      security:
        - session: []
      parameters:
        - name: language
          in: query
          required: true
          schema: { $ref: "#/components/schemas/LanguageCode" }
        - name: skip
          in: query
          description: Concepts skipped in this session, so they are not offered again
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        "200":
          description: The next card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCard" }
        "204":
          description: Nothing left to review in this language
        default:
          $ref: "#/components/responses/Error"
  /v1/credits:
    get:
      operationId: listCredits
      summary: The volunteers behind a language's data
      description: |
        Everyone credited for accepted work in the language (CON-5): contributors for their
        words that were verified, reviewers for decisions that matched a settled outcome.
        Only people who chose to be credited, by display name (NFR-6).
      tags: [review]
      parameters:
        - name: language
          in: query
          required: true
          schema: { $ref: "#/components/schemas/LanguageCode" }
      responses:
        "200":
          description: Up to 500 people, most credited first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditList" }
        default:
          $ref: "#/components/responses/Error"
  /v1/reviews:
    post:
      operationId: createReviews
      summary: Record review decisions (reviewers)
      description: |
        Accept or reject candidates from one card. Candidates left out stay in the queue.
        Each reviewer decides on an item once (`conflict` otherwise).
      tags: [review]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewList" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteReviews
      summary: Undo your own decision (reviewers)
      description: |
        Takes back the reviews one decision recorded, all or none. Only their reviewer can,
        within 10 minutes and while the items are still in the queue (`conflict` otherwise).
      tags: [review]
      security:
        - session: []
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items: { type: string, format: uuid }
      responses:
        "204":
          description: Undone; the items are back in the reviewer's queue
        default:
          $ref: "#/components/responses/Error"
  /v1/approvals:
    get:
      operationId: listApprovals
      summary: Every reviewer approval (admin)
      tags: [accounts]
      security:
        - session: []
      responses:
        "200":
          description: Approvals by language, then name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalList" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: approveReviewer
      summary: Approve a user to review a language, or change their level (admin)
      description: The user must have signed up. Approving again changes the level (CON-2).
      tags: [accounts]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalInput" }
      responses:
        "204":
          description: Approved
        default:
          $ref: "#/components/responses/Error"
  /v1/approvals/{user_id}/{language}:
    delete:
      operationId: revokeApproval
      summary: Remove a reviewer approval (admin)
      tags: [accounts]
      security:
        - session: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
        - name: language
          in: path
          required: true
          schema: { $ref: "#/components/schemas/LanguageCode" }
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /v1/provider-quality:
    get:
      operationId: getProviderQuality
      summary: Acceptance and correction rates per AI provider and language (admin)
      description: Reviews of items each machine source proposed (AI-5). Reviews a send-back set aside do not count.
      tags: [review]
      security:
        - session: []
      responses:
        "200":
          description: One row per provider and language
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderQualityList" }
        default:
          $ref: "#/components/responses/Error"
  /v1/reviewers:
    get:
      operationId: listReviewers
      summary: Reviewers of a language with their agreement rates (senior reviewers)
      description: |
        Every approved reviewer of the language, suspended ones first (DQ-7). A reviewer is
        suspended below 80% agreement over at least 20 settled decisions.
      tags: [review]
      security:
        - session: []
      parameters:
        - name: language
          in: query
          required: true
          schema: { $ref: "#/components/schemas/LanguageCode" }
      responses:
        "200":
          description: The language's reviewers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewerList" }
        default:
          $ref: "#/components/responses/Error"
  /v1/reviewers/{user_id}/retraining:
    post:
      operationId: markRetrained
      summary: Record that a reviewer was retrained (senior reviewers)
      description: Restarts the reviewer's agreement count in the language, which lifts a suspension.
      tags: [review]
      security:
        - session: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language]
              properties:
                language: { $ref: "#/components/schemas/LanguageCode" }
      responses:
        "204":
          description: Recorded
        default:
          $ref: "#/components/responses/Error"
  /v1/disputes:
    get:
      operationId: listDisputes
      summary: Disagreements waiting for a senior reviewer (senior reviewers)
      description: |
        Items reviewers disagree on, in the languages the caller is a senior reviewer for,
        oldest first, with every decision that counts (CON-4). Resolve within 14 days (DQ-8).
      tags: [review]
      security:
        - session: []
      responses:
        "200":
          description: Up to 50 disputes, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeList" }
        default:
          $ref: "#/components/responses/Error"
  /v1/disputes/{sense_id}/resolution:
    post:
      operationId: resolveDispute
      summary: Settle a dispute (senior reviewers)
      description: |
        `keep` verifies the item. `send_back` returns it to the review queue, where only
        reviews made after this count. Seniors cannot settle disputes they reviewed.
      tags: [review]
      security:
        - session: []
      parameters:
        - name: sense_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolutionInput" }
      responses:
        "200":
          description: Settled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resolution" }
        default:
          $ref: "#/components/responses/Error"
  /v1/sources:
    get:
      operationId: listSources
      summary: The source register
      description: |
        Every source the dataset draws on, with its licence (DQ-1). Public, so anyone can
        check where data came from. Permission documents are admin-only.
      tags: [sources]
      responses:
        "200":
          description: All sources, by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceList" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSource
      summary: Add a source to the register (admin)
      tags: [sources]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        default:
          $ref: "#/components/responses/Error"
  /v1/sources/{id}:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    get:
      operationId: getSource
      summary: One source
      tags: [sources]
      responses:
        "200":
          description: The source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateSource
      summary: Replace a source's details (admin)
      tags: [sources]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSource
      summary: Remove a source no item cites yet (admin)
      description: A source that items cite cannot be deleted (`conflict`).
      tags: [sources]
      security:
        - session: []
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /v1/sources/{id}/permission:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    put:
      operationId: uploadPermission
      summary: Upload the signed permission document (admin)
      description: |
        The raw file as the body, at most 10 MB. The server checks the bytes and accepts
        PDF, PNG or JPEG only. Replaces any earlier upload.
      tags: [sources]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: downloadPermission
      summary: Download the permission document (admin)
      tags: [sources]
      security:
        - session: []
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    SourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: Session token from signing in to the web app (ADR-0007).
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    LanguageCode:
      type: string
      description: ISO 639-3 code
      pattern: "^[a-z]{3}$"
      example: bem
    Language:
      type: object
      required: [code, name, own_name, wave, status, entries]
      properties:
        code: { $ref: "#/components/schemas/LanguageCode" }
        name:
          type: string
          description: English name
          example: Bemba
        own_name:
          type: string
          description: Name of the language in the language itself
          example: Ichibemba
        wave:
          type: integer
          description: Rollout wave from the delivery plan
          minimum: 1
          example: 1
        status:
          type: string
          enum: [active, planned]
        entries: { $ref: "#/components/schemas/EntryCounts" }
    EntryCounts:
      type: object
      description: |
        Live counts of entries. An entry counts as verified when one of its senses is, and
        towards the total when it has a sense that can be served (not disputed).
      required: [verified, total]
      properties:
        verified: { type: integer, example: 1204 }
        total: { type: integer, example: 2845 }
    LanguageList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Language" }
    Role:
      type: string
      description: Global account role. Review rights are per language, in `approvals`.
      enum: [developer, contributor, admin]
    ReviewerLevel:
      type: string
      enum: [reviewer, senior]
    Approval:
      type: object
      required: [language, level, suspended]
      properties:
        language: { $ref: "#/components/schemas/LanguageCode" }
        level: { $ref: "#/components/schemas/ReviewerLevel" }
        suspended:
          type: boolean
          description: |
            Agreement fell below the threshold, so the approval is paused until a senior
            reviewer marks the reviewer retrained (DQ-7)
    Credit:
      type: object
      required: [name, words, reviews]
      properties:
        name: { type: string }
        words: { type: integer, description: Their contributed words that are verified }
        reviews:
          { type: integer, description: Their review decisions that matched the settled outcome }
    CreditList:
      type: object
      required: [credits]
      properties:
        credits:
          type: array
          items: { $ref: "#/components/schemas/Credit" }
    UserApproval:
      type: object
      required: [user_id, name, email, language, level, suspended]
      properties:
        user_id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        language: { $ref: "#/components/schemas/LanguageCode" }
        level: { $ref: "#/components/schemas/ReviewerLevel" }
        suspended: { type: boolean }
    ApprovalList:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items: { $ref: "#/components/schemas/UserApproval" }
    ApprovalInput:
      type: object
      additionalProperties: false
      required: [email, language, level]
      properties:
        email: { type: string, format: email }
        language: { $ref: "#/components/schemas/LanguageCode" }
        level: { $ref: "#/components/schemas/ReviewerLevel" }
    ProviderQuality:
      type: object
      required: [provider, language, decided, accepted, corrected]
      properties:
        provider: { type: string, description: The machine source's name in the register }
        language: { $ref: "#/components/schemas/LanguageCode" }
        decided: { type: integer, description: Review decisions on its candidates }
        accepted: { type: integer }
        corrected: { type: integer }
    ProviderQualityList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderQuality" }
    Reviewer:
      type: object
      required: [user_id, name, level, decided, agreed, suspended]
      properties:
        user_id: { type: string }
        name: { type: string }
        level: { $ref: "#/components/schemas/ReviewerLevel" }
        decided:
          type: integer
          description: Decisions on items whose outcome is settled, since the last retraining
        agreed:
          type: integer
          description: Of those, the decisions that match the outcome
        suspended: { type: boolean }
        retrained_at: { type: string, format: date-time }
    ReviewerList:
      type: object
      required: [reviewers]
      properties:
        reviewers:
          type: array
          items: { $ref: "#/components/schemas/Reviewer" }
    Me:
      type: object
      required: [id, name, email, role, approvals, credited]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role: { $ref: "#/components/schemas/Role" }
        approvals:
          type: array
          items: { $ref: "#/components/schemas/Approval" }
        credited:
          type: boolean
          description: The user chose to be credited by name on the public contributors page
    SourceKind:
      type: string
      description: "`licensed`: a third party's data used under licence. `contributor`: our volunteers. `machine`: an AI provider's output."
      enum: [licensed, contributor, machine]
    AllowedUse:
      type: string
      description: "`train` means the data may be used to train models (AI-7)."
      enum: [redistribute, derive, commercial, train]
    SourceInput:
      type: object
      required: [kind, name, rights_holder, licence, allowed_uses]
      properties:
        kind: { $ref: "#/components/schemas/SourceKind" }
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: GATITOS
        rights_holder:
          type: string
          minLength: 1
          example: Google LLC
        licence:
          type: string
          minLength: 1
          example: CC BY 4.0
        url:
          type: string
          format: uri
        allowed_uses:
          type: array
          description: What the licence allows
          items: { $ref: "#/components/schemas/AllowedUse" }
        notes:
          type: string
    Source:
      allOf:
        - $ref: "#/components/schemas/SourceInput"
        - type: object
          required: [id, has_permission_document, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            has_permission_document:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    SourceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Source" }
    PartOfSpeech:
      type: string
      enum:
        [
          noun,
          verb,
          adjective,
          adverb,
          pronoun,
          numeral,
          conjunction,
          preposition,
          interjection,
          phrase,
          ideophone,
        ]
    ContributionInput:
      type: object
      additionalProperties: false
      required: [language, headword, part_of_speech, gloss_en, agree_to_licence]
      properties:
        language:
          type: string
          description: ISO 639-3 code of an active language
          pattern: "^[a-z]{3}$"
          example: bem
        headword:
          type: string
          minLength: 1
          maxLength: 100
          example: amenshi
        part_of_speech: { $ref: "#/components/schemas/PartOfSpeech" }
        noun_class:
          type: string
          description: Singular/plural class pair, for nouns
          pattern: "^[0-9]{1,2}(/[0-9]{1,2})?$"
          example: "6"
        gloss_en:
          type: string
          minLength: 1
          maxLength: 200
          example: water
        example:
          type: object
          additionalProperties: false
          required: [text, translation_en]
          properties:
            text: { type: string, minLength: 1, maxLength: 500 }
            translation_en: { type: string, minLength: 1, maxLength: 500 }
        agree_to_licence:
          type: boolean
          description: The contributor agrees their contribution is published under the dataset licence
          enum: [true]
    Contribution:
      type: object
      required: [entry_id, sense_id, new_sense, trust]
      properties:
        entry_id: { type: string, format: uuid }
        sense_id: { type: string, format: uuid }
        example_id: { type: string, format: uuid }
        new_sense:
          type: boolean
          description: False when the word and meaning were already known; the contribution counts as agreement
        trust: { $ref: "#/components/schemas/Trust" }
    ReviewPriority:
      type: string
      description: "`quick`: every source agrees. `standard`: at least two agree. `full`: no agreement (AI-3)."
      enum: [quick, standard, full]
    ReviewCandidate:
      type: object
      required: [sense_id, headword]
      properties:
        sense_id: { type: string, format: uuid }
        headword:
          type: string
          example: amenshi
        part_of_speech:
          $ref: "#/components/schemas/PartOfSpeech"
          description: Absent when the source did not give one
        noun_class:
          type: string
          example: "6"
        plural:
          type: string
    Dispute:
      type: object
      required: [language, gloss_en, candidate, disputed_since, reviews]
      properties:
        language: { $ref: "#/components/schemas/LanguageCode" }
        gloss_en: { type: string }
        candidate: { $ref: "#/components/schemas/ReviewCandidate" }
        disputed_since:
          type: string
          format: date-time
          description: When the last counted review was made
        reviews:
          type: array
          description: Oldest first. Reviewers stay anonymous.
          items: { $ref: "#/components/schemas/DisputeReview" }
    DisputeReview:
      type: object
      required: [decision, comment, created_at]
      properties:
        decision: { $ref: "#/components/schemas/ReviewDecision" }
        comment: { type: string }
        correction:
          type: string
          description: The word the reviewer wrote instead, for `correct` decisions
        created_at: { type: string, format: date-time }
    DisputeList:
      type: object
      required: [disputes]
      properties:
        disputes:
          type: array
          items: { $ref: "#/components/schemas/Dispute" }
    ResolutionOutcome:
      type: string
      enum: [keep, send_back]
    ResolutionInput:
      type: object
      additionalProperties: false
      required: [outcome, note]
      properties:
        outcome: { $ref: "#/components/schemas/ResolutionOutcome" }
        note: { type: string, minLength: 1, maxLength: 1000 }
    Resolution:
      type: object
      required: [sense_id, outcome, status]
      properties:
        sense_id: { type: string, format: uuid }
        outcome: { $ref: "#/components/schemas/ResolutionOutcome" }
        status: { $ref: "#/components/schemas/TrustStatus" }
    ReviewCard:
      type: object
      required: [language, concept_id, gloss_en, priority, candidates]
      properties:
        language: { $ref: "#/components/schemas/LanguageCode" }
        concept_id: { type: string, format: uuid }
        gloss_en:
          type: string
          example: water
        priority: { $ref: "#/components/schemas/ReviewPriority" }
        candidates:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReviewCandidate" }
    ReviewDecision:
      type: string
      description: "`correct`: none of the candidates is right, and the reviewer writes the right word in `correction`."
      enum: [accept, reject, correct]
    ReviewInput:
      type: object
      additionalProperties: false
      required: [decisions]
      properties:
        decisions:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [sense_id, decision]
            properties:
              sense_id: { type: string, format: uuid }
              decision: { $ref: "#/components/schemas/ReviewDecision" }
        comment:
          type: string
          maxLength: 500
          description: Why, for rejections
        correction:
          type: object
          additionalProperties: false
          description: |
            The reviewer's own word for the card's meaning, required with `correct` decisions.
            It becomes a new candidate that other reviewers check; the candidates it replaces
            keep their history (US-22).
          required: [headword]
          properties:
            headword: { type: string, minLength: 1, maxLength: 100 }
            part_of_speech: { $ref: "#/components/schemas/PartOfSpeech" }
            noun_class:
              type: string
              pattern: "^[0-9]{1,2}(/[0-9]{1,2})?$"
    Review:
      type: object
      required: [id, sense_id, decision]
      properties:
        id: { type: string, format: uuid }
        sense_id: { type: string, format: uuid }
        decision: { $ref: "#/components/schemas/ReviewDecision" }
        correction_sense_id:
          type: string
          format: uuid
          description: The new candidate a correction created
    ReviewList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Review" }
    TrustStatus:
      type: string
      description: |
        How far an item has been checked (ADR-0004). Only `verified` is returned by default;
        `disputed` is never returned.
      enum: [verified, reviewed, sourced, machine, disputed]
    SourceRef:
      type: object
      required: [name, licence]
      properties:
        name:
          type: string
          example: GATITOS
        licence:
          type: string
          example: CC BY 4.0
        url:
          type: string
          format: uri
        reference:
          type: string
          description: Page, line or row in the source
        model:
          type: string
          description: Model version, present only for machine-generated items
          example: claude-opus-5-5
    ReviewSummary:
      type: object
      description: Counts only. Reviewer identities are not exposed per item.
      required: [accepts, corrections]
      properties:
        accepts:
          type: integer
          minimum: 0
        corrections:
          type: integer
          minimum: 0
        last_reviewed_at:
          type: string
          format: date-time
    Trust:
      type: object
      description: |
        Provenance carried by every item (PRV-1). Item schemas include it as a `trust`
        property; never copy these fields into an item schema.
      required: [status, sources, reviews]
      properties:
        status: { $ref: "#/components/schemas/TrustStatus" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        reviews: { $ref: "#/components/schemas/ReviewSummary" }
        release:
          type: string
          description: Dataset release the item belongs to, absent until first released
          pattern: "^[0-9]{4}\\.[0-9]+$"
          example: "2027.1"
    ErrorCode:
      type: string
      description: |
        Stable machine-readable code. Codes are never renamed; new codes may be added,
        so treat unknown values as a generic error.
      enum:
        [
          bad_request,
          unauthorized,
          forbidden,
          not_found,
          method_not_allowed,
          conflict,
          payload_too_large,
          rate_limited,
          internal,
          unavailable,
        ]
      example: not_found
    Error:
      type: object
      required: [code, message, docs_url]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          example: Entry not found
        docs_url:
          type: string
          format: uri
