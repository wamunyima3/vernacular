openapi: 3.0.3
info:
  title: Vernacular API
  version: 0.1.0
  summary: Verified words, phrases and translations for Zambian languages.
  description: |
    Every item the API returns says where it came from and who checked it.
    Only items accepted by two independent native-speaker reviewers are `verified`,
    and only verified items are returned by default.

    ## Keys and limits

    Send your API key in the `X-API-Key` header. Calls are limited per key, and anonymous
    calls per IP address, in one-minute windows (120 and 30 requests by default). Every
    response says where you stand in `X-RateLimit-Limit`, `X-RateLimit-Remaining` and
    `X-RateLimit-Reset` (Unix seconds). Over the limit, the API answers `429` with
    `Retry-After`.

    ## Caching

    Responses are compressed when you send `Accept-Encoding`. Successful `GET` responses
    carry an `ETag`; send it back in `If-None-Match` and an unchanged response is a bodyless
    `304`. Data may be reused for five minutes (`Cache-Control: private, max-age=300`).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: system
  - name: languages
  - name: accounts
  - name: sources
  - name: contributions
  - name: review
  - name: lexicon
  - name: phrases
  - name: detect
  - name: releases
  - name: audio
    description: |
      Pronunciation clips and the speakers' consent records (LEX-8, NFR-6). Off unless the
      server sets AUDIO_ENABLED; until then these endpoints return 404.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database readiness
      tags: [system]
      responses:
        "200":
          description: Service and database are reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          $ref: "#/components/responses/Error"
  /v1/languages:
    get:
      operationId: listLanguages
      summary: Supported and planned languages
      description: Languages in rollout order. `status` is `active` once the language serves data.
      tags: [languages]
      responses:
        "200":
          description: All languages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageList" }
        default:
          $ref: "#/components/responses/Error"
  /v1/entries/search:
    get:
      operationId: searchEntries
      summary: Search a language's dictionary entries
      description: |
        Finds entries by headword, tolerating case, accents, spelling variants, missing
        prefixes and small typing errors (LEX-4, NFR-7). Each hit says what matched:
        the headword, a spelling variant, the root (an inflected or prefixed form) or a
        similar spelling. Best matches first. Disputed items are never returned.
      tags: [lexicon]
      security:
        - apiKey: []
        - session: []
      parameters:
        - name: language
          in: query
          required: true
          schema: { $ref: "#/components/schemas/LanguageCode" }
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: amenshi
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - $ref: "#/components/parameters/MinStatus"
        - $ref: "#/components/parameters/Variety"
        - $ref: "#/components/parameters/PinnedRelease"
      responses:
        "200":
          description: Matching entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntrySearchResults" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/entries/{id}:
    get:
      operationId: getEntry
      summary: A full dictionary entry
      description: |
        The entry with its spelling variants, and each servable sense with its definition,
        concept and example sentences (LEX-1, LEX-3, LEX-5, US-16). Every item carries its
        trust fields. A disputed entry is not found.
      tags: [lexicon]
      security:
        - apiKey: []
        - session: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/MinStatus"
        - $ref: "#/components/parameters/PinnedRelease"
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/concepts/{id}:
    get:
      operationId: getConcept
      summary: A meaning across all languages
      description: |
        The language-independent concept, and every servable entry in any language with a
        sense that expresses it (LEX-7, US-04). Each entry lists only those senses.
      tags: [lexicon]
      security:
        - apiKey: []
        - session: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/MinStatus"
        - $ref: "#/components/parameters/Variety"
        - $ref: "#/components/parameters/PinnedRelease"
      responses:
        "200":
          description: The concept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Concept" }
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/lookup:
    get:
      operationId: lookup
      summary: Translate a word between English and Zambian languages
      description: |
        From English (`from=eng`), finds concepts whose English gloss matches the query and
        returns their entries in the `to` languages (LEX-2, US-04). From a Zambian language,
        searches its entries as `/v1/entries/search` does and returns the English meaning of
        each, grouped by concept. Each result says what matched; best matches first.
      tags: [lexicon]
      security:
        - apiKey: []
        - session: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: water
        - name: from
          in: query
          required: true
          schema: { $ref: "#/components/schemas/LanguageCode" }
          example: eng
        - name: to
          in: query
          description: |
            Target languages, comma-separated. From English, defaults to every language;
            from a Zambian language, only `eng` is accepted.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items: { $ref: "#/components/schemas/LanguageCode" }
          example: [bem, nya]
        - name: limit
          in: query
          description: Most concepts to return
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
        - $ref: "#/components/parameters/MinStatus"
        - $ref: "#/components/parameters/Variety"
        - $ref: "#/components/parameters/PinnedRelease"
      responses:
        "200":
          description: Matching concepts with their entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupResults" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/phrases:
    get:
      operationId: getPhrasePack
      summary: A curated phrase pack in one language
      description: |
        The phrases of a topic pack, such as greetings, numbers, dates, interface labels,
        health or money, each with its English source and trust fields (PHR-1, US-08).
        At most 1,000 phrases, in English order.
      tags: [phrases]
      security:
        - apiKey: []
        - session: []
      parameters:
        - $ref: "#/components/parameters/Pack"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/MinStatus"
        - $ref: "#/components/parameters/PinnedRelease"
      responses:
        "200":
          description: The pack; empty when it has no phrases at that level
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhrasePack" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/phrases/export:
    get:
      operationId: exportPhrasePack
      summary: A phrase pack as a localisation file
      description: |
        The pack as a file an i18n pipeline reads (PHR-3, US-12), keyed by the English
        source: `json` is a flat object from English to translation, `po` a gettext
        catalogue, and `xliff` an XLIFF 2.0 document whose segment state follows the trust
        status (`verified` is `final`). When an English line has several translations,
        the first is kept. Notes become translator comments.
      tags: [phrases]
      security:
        - apiKey: []
        - session: []
      parameters:
        - $ref: "#/components/parameters/Pack"
        - $ref: "#/components/parameters/Lang"
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [json, po, xliff] }
        - $ref: "#/components/parameters/MinStatus"
        - $ref: "#/components/parameters/PinnedRelease"
      responses:
        "200":
          description: The file, named `<pack>.<lang>.<format>`
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
                example: { Good morning: Mwashibukeni }
            text/x-gettext-translation:
              schema: { type: string }
            application/xliff+xml:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/detect:
    post:
      operationId: detectLanguage
      summary: Detect the language of a text
      description: |
        Ranks the supported languages, and English, by how likely the text is written in
        each, with confidences between 0 and 1 that sum to 1 (TRN-1, US-09). Short texts
        and closely related languages give close scores, so check the margin. Empty when
        the text has no letters. Languages without enough data yet are not detected
        (ADR-0010).
      tags: [detect]
      security:
        - apiKey: []
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000, example: Natotela sana }
      responses:
        "200":
          description: Languages, most likely first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Detection" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/translate:
    post:
      operationId: translate
      summary: Translate a short text between English and a Zambian language
      description: |
        Exact match, ignoring case and accents, against verified phrases (TRN-2, US-10).
        Each match has `method: verified_phrase`. No match returns an empty list, never a
        guess; labelled machine translation comes in a later phase (TRN-3).
      tags: [phrases]
      security:
        - apiKey: []
        - session: []
      parameters:
        - $ref: "#/components/parameters/PinnedRelease"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text, from, to]
              properties:
                text: { type: string, minLength: 1, maxLength: 500, example: Good morning }
                from: { $ref: "#/components/schemas/LanguageCode" }
                to: { $ref: "#/components/schemas/LanguageCode" }
      responses:
        "200":
          description: Matches, possibly none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationResults" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in user, with role and review approvals
      description: Used by the web tools. Requires a session token from sign-in.
      tags: [accounts]
      security:
        - session: []
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/keys:
    get:
      operationId: listKeys
      summary: Your API keys
      tags: [accounts]
      security:
        - session: []
      responses:
        "200":
          description: Keys, live first, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyList" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createKey
      summary: Create an API key
      description: |
        The key is in the response once and stored only as a hash (NFR-5, US-01). At most 10
        live keys per account.
      tags: [accounts]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100, example: My SMS app }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewKey" }
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/keys/{id}:
    delete:
      operationId: revokeKey
      summary: Revoke an API key
      description: Calls with the key return 401 from then on.
      tags: [accounts]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/keys/{id}/usage:
    get:
      operationId: getKeyUsage
      summary: Daily calls with one of your API keys
      description: |
        Calls, errors and calls refused by the rate limit, per UTC day, newest first; days
        without calls are left out (DEV-5, US-13). Counts arrive within a minute.
      tags: [accounts]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: days
          in: query
          description: How many days back, today included
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: The key's usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyUsage" }
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/credit:
    put:
      operationId: setCredit
      summary: Choose whether to be credited by name
      description: |
        Consent to appear on the public contributors page (CON-5, NFR-6). When it was given
        is recorded; turning it off removes the name at once.
      tags: [accounts]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credited]
              properties:
                credited: { type: boolean }
      responses:
        "204":
          description: Saved
        default:
          $ref: "#/components/responses/Error"
  /v1/contributions:
    post:
      operationId: createContribution
      summary: Propose a word (contributors)
      description: |
        Adds an entry and sense, and optionally an example, as `sourced` and queues them for
        blind review (CON-1, US-18). If the word and meaning already exist, the contribution
        is recorded as agreement with them instead.
      tags: [contributions]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContributionInput" }
      responses:
        "201":
          description: Recorded and queued for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contribution" }
        default:
          $ref: "#/components/responses/Error"
  /v1/review/next:
    get:
      operationId: getNextReview
      summary: The next concept to review (reviewers)
      description: |
        One English meaning with every pending candidate for it in the language, in random
        order and without provider names or other reviewers' decisions (CON-3, DQ-4, AI-4).
        Quick confirms come first, then standard, then full review (AI-3). Never includes
        items the reviewer wrote or has already reviewed. `204` when nothing is left.
      tags: [review]
      security:
        - session: []
      parameters:
        - name: language
          in: query
          required: true
          schema: { $ref: "#/components/schemas/LanguageCode" }
        - name: skip
          in: query
          description: Concepts skipped in this session, so they are not offered again
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        "200":
          description: The next card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCard" }
        "204":
          description: Nothing left to review in this language
        default:
          $ref: "#/components/responses/Error"
  /v1/credits:
    get:
      operationId: listCredits
      summary: The volunteers behind a language's data
      description: |
        Everyone credited for accepted work in the language (CON-5): contributors for their
        words that were verified, reviewers for decisions that matched a settled outcome.
        Only people who chose to be credited, by display name (NFR-6).
      tags: [review]
      parameters:
        - name: language
          in: query
          required: true
          schema: { $ref: "#/components/schemas/LanguageCode" }
      responses:
        "200":
          description: Up to 500 people, most credited first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditList" }
        default:
          $ref: "#/components/responses/Error"
  /v1/reviews:
    post:
      operationId: createReviews
      summary: Record review decisions (reviewers)
      description: |
        Accept or reject candidates from one card. Candidates left out stay in the queue.
        Each reviewer decides on an item once (`conflict` otherwise).
      tags: [review]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewList" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteReviews
      summary: Undo your own decision (reviewers)
      description: |
        Takes back the reviews one decision recorded, all or none. Only their reviewer can,
        within 10 minutes and while the items are still in the queue (`conflict` otherwise).
      tags: [review]
      security:
        - session: []
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items: { type: string, format: uuid }
      responses:
        "204":
          description: Undone; the items are back in the reviewer's queue
        default:
          $ref: "#/components/responses/Error"
  /v1/qualifications:
    get:
      operationId: listQualifications
      summary: Passed qualification tests waiting for a senior reviewer
      description: Only the languages the signed-in user is a senior reviewer for, oldest first.
      tags: [review]
      security:
        - session: []
      responses:
        "200":
          description: Passed tests to confirm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualificationList" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: startQualification
      summary: Start a reviewer qualification test
      description: |
        Ten questions drawn from the language's verified words: pick the word for each English
        meaning (DQ-3). A pass is 8 or more; a senior reviewer then confirms it, which approves
        you to review. After a fail you can try again the next day.
      tags: [review]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language]
              properties:
                language: { $ref: "#/components/schemas/LanguageCode" }
      responses:
        "201":
          description: The test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualificationTest" }
        default:
          $ref: "#/components/responses/Error"
  /v1/qualifications/{id}/answers:
    post:
      operationId: answerQualification
      summary: Hand in a qualification test
      tags: [review]
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answers]
              properties:
                answers:
                  type: array
                  description: The chosen option for each question, in order
                  minItems: 1
                  maxItems: 50
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The score
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualificationResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/qualifications/{id}/confirmation:
    post:
      operationId: confirmQualification
      summary: Confirm a passed test, approving its taker as a reviewer (senior reviewers)
      tags: [review]
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Confirmed; the taker is a reviewer of the language
        default:
          $ref: "#/components/responses/Error"
  /v1/approvals:
    get:
      operationId: listApprovals
      summary: Every reviewer approval (admin)
      tags: [accounts]
      security:
        - session: []
      responses:
        "200":
          description: Approvals by language, then name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalList" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: approveReviewer
      summary: Approve a user to review a language, or change their level (admin)
      description: The user must have signed up. Approving again changes the level (CON-2).
      tags: [accounts]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalInput" }
      responses:
        "204":
          description: Approved
        default:
          $ref: "#/components/responses/Error"
  /v1/approvals/{user_id}/{language}:
    delete:
      operationId: revokeApproval
      summary: Remove a reviewer approval (admin)
      tags: [accounts]
      security:
        - session: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
        - name: language
          in: path
          required: true
          schema: { $ref: "#/components/schemas/LanguageCode" }
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /v1/provider-quality:
    get:
      operationId: getProviderQuality
      summary: Acceptance and correction rates per AI provider and language (admin)
      description: Reviews of items each machine source proposed (AI-5). Reviews a send-back set aside do not count.
      tags: [review]
      security:
        - session: []
      responses:
        "200":
          description: One row per provider and language
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderQualityList" }
        default:
          $ref: "#/components/responses/Error"
  /v1/reviewers:
    get:
      operationId: listReviewers
      summary: Reviewers of a language with their agreement rates (senior reviewers)
      description: |
        Every approved reviewer of the language, suspended ones first (DQ-7). A reviewer is
        suspended below 80% agreement over at least 20 settled decisions.
      tags: [review]
      security:
        - session: []
      parameters:
        - name: language
          in: query
          required: true
          schema: { $ref: "#/components/schemas/LanguageCode" }
      responses:
        "200":
          description: The language's reviewers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewerList" }
        default:
          $ref: "#/components/responses/Error"
  /v1/reviewers/{user_id}/retraining:
    post:
      operationId: markRetrained
      summary: Record that a reviewer was retrained (senior reviewers)
      description: Restarts the reviewer's agreement count in the language, which lifts a suspension.
      tags: [review]
      security:
        - session: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language]
              properties:
                language: { $ref: "#/components/schemas/LanguageCode" }
      responses:
        "204":
          description: Recorded
        default:
          $ref: "#/components/responses/Error"
  /v1/disputes:
    get:
      operationId: listDisputes
      summary: Disagreements waiting for a senior reviewer (senior reviewers)
      description: |
        Items reviewers disagree on, in the languages the caller is a senior reviewer for,
        oldest first, with every decision that counts (CON-4). Resolve within 14 days (DQ-8).
      tags: [review]
      security:
        - session: []
      responses:
        "200":
          description: Up to 50 disputes, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeList" }
        default:
          $ref: "#/components/responses/Error"
  /v1/disputes/{item_id}/resolution:
    post:
      operationId: resolveDispute
      summary: Settle a dispute (senior reviewers)
      description: |
        `keep` verifies the item. `send_back` returns it to the review queue, where only
        reviews made after this count. Seniors cannot settle disputes they reviewed.
      tags: [review]
      security:
        - session: []
      parameters:
        - name: item_id
          in: path
          required: true
          description: The disputed sense or phrase
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolutionInput" }
      responses:
        "200":
          description: Settled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resolution" }
        default:
          $ref: "#/components/responses/Error"
  /v1/reports:
    post:
      operationId: createReport
      summary: Report a wrong meaning
      description: |
        Anyone can report a sense as wrong, signed in or not (PRV-3, US-15). The report
        reaches the reviewers of its language. If a reviewer confirms it, the sense becomes
        `disputed` until a senior reviewer settles it.
      tags: [review]
      security:
        - {}
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sense_id, reason]
              properties:
                sense_id: { type: string, format: uuid }
                reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
                  example: This word means moon, not water.
      responses:
        "201":
          description: Reported
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listReports
      summary: Open reports in a language (reviewers)
      description: The reviewers' report inbox, oldest first, at most 100.
      tags: [review]
      security:
        - session: []
      parameters:
        - name: language
          in: query
          required: true
          schema: { $ref: "#/components/schemas/LanguageCode" }
      responses:
        "200":
          description: Open reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
        default:
          $ref: "#/components/responses/Error"
  /v1/reports/{id}/decision:
    post:
      operationId: decideReport
      summary: Confirm or dismiss a report (reviewers)
      description: |
        Confirming says the report has merit: the sense becomes `disputed` and goes to the
        senior reviewers (US-15). Dismissing closes it. Reviewers cannot decide their own
        reports.
      tags: [review]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, note]
              properties:
                confirm: { type: boolean }
                note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Decided; the sense's status afterwards
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { $ref: "#/components/schemas/TrustStatus" }
        default:
          $ref: "#/components/responses/Error"
  /v1/releases:
    get:
      operationId: listReleases
      summary: Dataset releases and their change logs
      description: |
        Numbered, frozen copies of the verified data (PRV-4), newest first. Each gives its
        counts per language and what changed since the release before it. Public.
      tags: [releases]
      responses:
        "200":
          description: Every release, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseList" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRelease
      summary: Build a release from the verified items (admin)
      description: |
        Freezes every verified item into a new release named `<year>.<n>` (US-29). Refused
        with `conflict` when nothing is verified yet or nothing changed since the last release.
      tags: [releases]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseInput" }
      responses:
        "201":
          description: The new release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        default:
          $ref: "#/components/responses/Error"
  /v1/releases/{name}/download:
    get:
      operationId: downloadRelease
      summary: Download a release as open data
      description: |
        The release as a zip of CSV files, one per table (entries, variants, senses,
        examples, phrases, concepts, item_sources, sources), with `release.json` and a
        README describing them (NFR-9, US-17). Frozen like a pinned read (ADR-0012):
        concepts and source details are as they are now. Public.
      tags: [releases]
      parameters:
        - name: name
          in: path
          required: true
          description: A release, such as `2027.1`, or `latest`
          schema: { type: string, pattern: "^(latest|[0-9]{4}\\.[0-9]+)$" }
      responses:
        "200":
          description: The zip archive
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename="vernacular-<release>.zip"
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/sources:
    get:
      operationId: listSources
      summary: The source register
      description: |
        Every source the dataset draws on, with its licence (DQ-1). Public, so anyone can
        check where data came from. Permission documents are admin-only.
      tags: [sources]
      responses:
        "200":
          description: All sources, by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceList" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSource
      summary: Add a source to the register (admin)
      tags: [sources]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        default:
          $ref: "#/components/responses/Error"
  /v1/sources/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSource
      summary: One source
      tags: [sources]
      responses:
        "200":
          description: The source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateSource
      summary: Replace a source's details (admin)
      tags: [sources]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSource
      summary: Remove a source no item cites yet (admin)
      description: A source that items cite cannot be deleted (`conflict`).
      tags: [sources]
      security:
        - session: []
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /v1/sources/{id}/permission:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: uploadPermission
      summary: Upload the signed permission document (admin)
      description: |
        The raw file as the body, at most 10 MB. The server checks the bytes and accepts
        PDF, PNG or JPEG only. Replaces any earlier upload.
      tags: [sources]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: downloadPermission
      summary: Download the permission document (admin)
      tags: [sources]
      security:
        - session: []
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default:
          $ref: "#/components/responses/Error"
  /v1/speakers/{user_id}/consent:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: recordConsent
      summary: Record a speaker's signed consent form (admin)
      description: |
        The scanned form as the body, at most 10 MB: PDF, PNG or JPEG, and the languages it
        lets the speaker record. Recording a form again replaces the earlier one and, after a
        withdrawal, restores consent.
      tags: [audio]
      security:
        - session: []
      parameters:
        - name: languages
          in: query
          required: true
          style: form
          explode: false
          description: The languages the speaker records, comma-separated
          schema:
            type: array
            minItems: 1
            items: { $ref: "#/components/schemas/LanguageCode" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Speaker" }
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: downloadConsent
      summary: Download a speaker's consent form (admin)
      tags: [audio]
      security:
        - session: []
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/speaker:
    get:
      operationId: getMySpeaker
      summary: Your consent to be recorded
      description: 404 when no consent form has been recorded for you.
      tags: [audio]
      security:
        - session: []
      responses:
        "200":
          description: Your consent record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Speaker" }
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: withdrawConsent
      summary: Withdraw your consent to be recorded
      description: |
        You can no longer record, and your clips and their files are deleted (NFR-6). The
        record of when you consented and withdrew is kept.
      tags: [audio]
      security:
        - session: []
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Speaker" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/audio:
    get:
      operationId: listClips
      summary: An entry's pronunciation clips
      tags: [audio]
      parameters:
        - name: entry_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Clips, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClipList" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: recordClip
      summary: Record a pronunciation of an entry
      description: |
        The recording as the body, at most 1 MB: Ogg, WebM, MP4, MP3 or WAV. You need a consent
        form on file that names the entry's language. Recording an entry again replaces your
        earlier clip.
      tags: [audio]
      security:
        - session: []
      parameters:
        - name: entry_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Clip" }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/audio/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getClip
      summary: A clip's sound file
      tags: [audio]
      responses:
        "200":
          description: The recording, with its own content type
          content:
            audio/*:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteClip
      summary: Delete a clip (its speaker or an admin)
      tags: [audio]
      security:
        - session: []
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    MinStatus:
      name: min_status
      in: query
      description: |
        The least-checked items to return (TRN-4, AI-6, ADR-0004): `verified` by default;
        `machine` only when asked for. `disputed` is never returned. Entries and concepts
        with no meaning at this level are left out, so a strict caller gets nothing rather
        than a guess.
      schema: { $ref: "#/components/schemas/MinStatus" }
    Variety:
      name: variety
      in: query
      description: Only entries of this variety, such as a town or regional form (LEX-6)
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$", maxLength: 40 }
    Pack:
      name: pack
      in: query
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$", maxLength: 40 }
      example: greetings
    Lang:
      name: lang
      in: query
      required: true
      schema: { $ref: "#/components/schemas/LanguageCode" }
    PinnedRelease:
      name: release
      in: query
      description: |
        Read a frozen dataset release, such as `2027.1`, or `latest` for the newest
        (US-11, ADR-0012), so the data does not change under your app. Without it, reads
        use the live data. Items carry the release in `trust.release`. Review counts and
        source details stay live. An unknown release is `not_found`; `GET /v1/releases`
        lists them.
      schema: { type: string, pattern: "^(latest|[0-9]{4}\\.[0-9]+)$", example: "2027.1" }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        A developer key from your account page (DEV-1). Data endpoints need a key, or a
        signed-in session.
    session:
      type: http
      scheme: bearer
      description: Session token from signing in to the web app (ADR-0007).
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    LanguageCode:
      type: string
      description: ISO 639-3 code
      pattern: "^[a-z]{3}$"
      example: bem
    Language:
      type: object
      required: [code, name, own_name, wave, status, entries]
      properties:
        code: { $ref: "#/components/schemas/LanguageCode" }
        name:
          type: string
          description: English name
          example: Bemba
        own_name:
          type: string
          description: Name of the language in the language itself
          example: Ichibemba
        wave:
          type: integer
          description: Rollout wave from the delivery plan
          minimum: 1
          example: 1
        status:
          type: string
          enum: [active, planned]
        entries: { $ref: "#/components/schemas/EntryCounts" }
    EntryCounts:
      type: object
      description: |
        Live counts of entries. An entry counts as verified when one of its senses is, and
        towards the total when it has a sense that can be served (not disputed).
      required: [verified, total]
      properties:
        verified: { type: integer, example: 1204 }
        total: { type: integer, example: 2845 }
    LanguageList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Language" }
    Role:
      type: string
      description: Global account role. Review rights are per language, in `approvals`.
      enum: [developer, contributor, admin]
    ReviewerLevel:
      type: string
      enum: [reviewer, senior]
    Approval:
      type: object
      required: [language, level, suspended]
      properties:
        language: { $ref: "#/components/schemas/LanguageCode" }
        level: { $ref: "#/components/schemas/ReviewerLevel" }
        suspended:
          type: boolean
          description: |
            Agreement fell below the threshold, so the approval is paused until a senior
            reviewer marks the reviewer retrained (DQ-7)
    Credit:
      type: object
      required: [name, words, reviews]
      properties:
        name: { type: string }
        words: { type: integer, description: Their contributed words that are verified }
        reviews:
          { type: integer, description: Their review decisions that matched the settled outcome }
    CreditList:
      type: object
      required: [credits]
      properties:
        credits:
          type: array
          items: { $ref: "#/components/schemas/Credit" }
    UserApproval:
      type: object
      required: [user_id, name, email, language, level, suspended]
      properties:
        user_id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        language: { $ref: "#/components/schemas/LanguageCode" }
        level: { $ref: "#/components/schemas/ReviewerLevel" }
        suspended: { type: boolean }
    ApprovalList:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items: { $ref: "#/components/schemas/UserApproval" }
    ApprovalInput:
      type: object
      additionalProperties: false
      required: [email, language, level]
      properties:
        email: { type: string, format: email }
        language: { $ref: "#/components/schemas/LanguageCode" }
        level: { $ref: "#/components/schemas/ReviewerLevel" }
    ProviderQuality:
      type: object
      required: [provider, language, decided, accepted, corrected]
      properties:
        provider: { type: string, description: The machine source's name in the register }
        language: { $ref: "#/components/schemas/LanguageCode" }
        decided: { type: integer, description: Review decisions on its candidates }
        accepted: { type: integer }
        corrected: { type: integer }
    ProviderQualityList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderQuality" }
    Reviewer:
      type: object
      required: [user_id, name, level, decided, agreed, suspended]
      properties:
        user_id: { type: string }
        name: { type: string }
        level: { $ref: "#/components/schemas/ReviewerLevel" }
        decided:
          type: integer
          description: Decisions on items whose outcome is settled, since the last retraining
        agreed:
          type: integer
          description: Of those, the decisions that match the outcome
        suspended: { type: boolean }
        retrained_at: { type: string, format: date-time }
    ReviewerList:
      type: object
      required: [reviewers]
      properties:
        reviewers:
          type: array
          items: { $ref: "#/components/schemas/Reviewer" }
    Me:
      type: object
      required: [id, name, email, role, approvals, credited]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role: { $ref: "#/components/schemas/Role" }
        approvals:
          type: array
          items: { $ref: "#/components/schemas/Approval" }
        credited:
          type: boolean
          description: The user chose to be credited by name on the public contributors page
    SourceKind:
      type: string
      description: "`licensed`: a third party's data used under licence. `contributor`: our volunteers. `machine`: an AI provider's output."
      enum: [licensed, contributor, machine]
    AllowedUse:
      type: string
      description: "`train` means the data may be used to train models (AI-7)."
      enum: [redistribute, derive, commercial, train]
    SourceInput:
      type: object
      required: [kind, name, rights_holder, licence, allowed_uses]
      properties:
        kind: { $ref: "#/components/schemas/SourceKind" }
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: GATITOS
        rights_holder:
          type: string
          minLength: 1
          example: Google LLC
        licence:
          type: string
          minLength: 1
          example: CC BY 4.0
        url:
          type: string
          format: uri
        allowed_uses:
          type: array
          description: What the licence allows
          items: { $ref: "#/components/schemas/AllowedUse" }
        notes:
          type: string
    Source:
      allOf:
        - $ref: "#/components/schemas/SourceInput"
        - type: object
          required: [id, has_permission_document, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            has_permission_document:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ReleaseInput:
      type: object
      required: [notes]
      properties:
        notes:
          type: string
          maxLength: 5000
          description: The change log in the admin's words; may be empty
    KindCounts:
      type: object
      description: Verified items in a release, by kind
      required: [entries, senses, examples, phrases]
      properties:
        entries: { type: integer, minimum: 0 }
        senses: { type: integer, minimum: 0 }
        examples: { type: integer, minimum: 0 }
        phrases: { type: integer, minimum: 0 }
    ReleaseChanges:
      type: object
      description: Items compared with the release before; everything is added in the first
      required: [added, changed, removed]
      properties:
        added: { type: integer, minimum: 0 }
        changed: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
    Release:
      type: object
      required: [name, published_at, notes, languages, changes]
      properties:
        name:
          type: string
          pattern: "^[0-9]{4}\\.[0-9]+$"
          example: "2027.1"
        published_at:
          type: string
          format: date-time
        notes: { type: string }
        languages:
          type: object
          description: Counts per language code
          additionalProperties: { $ref: "#/components/schemas/KindCounts" }
        changes: { $ref: "#/components/schemas/ReleaseChanges" }
    ReleaseList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Release" }
    SourceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Source" }
    PartOfSpeech:
      type: string
      enum:
        [
          noun,
          verb,
          adjective,
          adverb,
          pronoun,
          numeral,
          conjunction,
          preposition,
          interjection,
          phrase,
          ideophone,
        ]
    Register:
      type: string
      description: Social register of a word (LEX-6)
      enum: [neutral, formal, informal, town, respectful, vulgar, archaic]
    SenseSummary:
      type: object
      required: [id, gloss, trust]
      properties:
        id: { type: string, format: uuid }
        gloss:
          type: string
          description: Short English meaning
          example: water
        trust: { $ref: "#/components/schemas/Trust" }
    EntrySummary:
      type: object
      description: A dictionary entry with its meanings (LEX-1, LEX-3, LEX-6)
      required: [id, language, headword, register, senses, trust]
      properties:
        id: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/LanguageCode" }
        headword: { type: string, example: amenshi }
        part_of_speech: { $ref: "#/components/schemas/PartOfSpeech" }
        noun_class: { type: string, example: "6" }
        plural: { type: string }
        root: { type: string }
        variety:
          type: string
          description: Variety code when not the standard language
        register: { $ref: "#/components/schemas/Register" }
        senses:
          type: array
          items: { $ref: "#/components/schemas/SenseSummary" }
        trust: { $ref: "#/components/schemas/Trust" }
    Variant:
      type: object
      required: [spelling]
      properties:
        spelling: { type: string, example: ichibemba }
        note:
          type: string
          description: Where the spelling is used, or where it was seen
    Example:
      type: object
      required: [id, text, translation_en, trust]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        translation_en: { type: string }
        trust: { $ref: "#/components/schemas/Trust" }
    Sense:
      type: object
      required: [id, gloss, examples, trust]
      properties:
        id: { type: string, format: uuid }
        gloss: { type: string, example: water }
        definition: { type: string }
        concept_id:
          type: string
          format: uuid
          description: The language-independent meaning this sense expresses (LEX-7)
        examples:
          type: array
          items: { $ref: "#/components/schemas/Example" }
        trust: { $ref: "#/components/schemas/Trust" }
    Entry:
      type: object
      description: A full dictionary entry (US-16)
      required: [id, language, headword, register, variants, senses, trust]
      properties:
        id: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/LanguageCode" }
        headword: { type: string, example: amenshi }
        part_of_speech: { $ref: "#/components/schemas/PartOfSpeech" }
        noun_class: { type: string, example: "6" }
        plural: { type: string }
        root: { type: string }
        variety: { type: string }
        register: { $ref: "#/components/schemas/Register" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }
        senses:
          type: array
          items: { $ref: "#/components/schemas/Sense" }
        trust: { $ref: "#/components/schemas/Trust" }
    Concept:
      type: object
      required: [id, gloss_en, domain, core, entries]
      properties:
        id: { type: string, format: uuid }
        gloss_en: { type: string, example: water }
        definition: { type: string }
        domain: { type: string, example: general }
        core:
          type: boolean
          description: Part of the core vocabulary list (LEX-7)
        entries:
          type: array
          description: Entries expressing the concept, by language then headword; at most 200
          items: { $ref: "#/components/schemas/EntrySummary" }
    MinStatus:
      type: string
      enum: [verified, reviewed, sourced, machine]
      default: verified
    Phrase:
      type: object
      required: [id, text, source_en, trust]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, example: Mwashibukeni }
        source_en: { type: string, example: Good morning }
        notes:
          type: string
          description: Context, and how the words around a placeholder change with what fills it
        placeholders:
          type: array
          description: |
            Names in braces in `source_en` and `text`, such as `name` for `{name}`, which your app
            fills in. Absent when the phrase has none (PHR-2).
          items: { type: string, example: name }
        concept_id: { type: string, format: uuid }
        trust: { $ref: "#/components/schemas/Trust" }
    TranslationResults:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Translation"
    Translation:
      type: object
      required: [method, translation, phrase]
      properties:
        method:
          type: string
          description: How the translation was found. Only verified phrases so far.
          enum: [verified_phrase]
        translation: { type: string, example: Mwashibukeni }
        phrase: { $ref: "#/components/schemas/Phrase" }
    PhrasePack:
      type: object
      required: [pack, language, data]
      properties:
        pack: { type: string, example: greetings }
        language: { $ref: "#/components/schemas/LanguageCode" }
        data:
          type: array
          items: { $ref: "#/components/schemas/Phrase" }
    Detection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/LanguageScore" }
    LanguageScore:
      type: object
      required: [language, confidence]
      properties:
        language:
          type: string
          description: ISO 639-3 code; `eng` for English
          example: bem
        confidence: { type: number, format: double, minimum: 0, maximum: 1, example: 0.93 }
    Report:
      type: object
      required: [id, sense_id, language, headword, gloss, status, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        sense_id: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/LanguageCode" }
        headword: { type: string }
        gloss: { type: string }
        status: { $ref: "#/components/schemas/TrustStatus" }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    ReportList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Report" }
    Key:
      type: object
      required: [id, name, prefix, created_at, calls_today, calls_30d]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix:
          type: string
          description: The key's first characters, to tell keys apart
          example: vk_3fA9
        last_used_at:
          type: string
          format: date-time
          description: To the hour
        revoked_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        calls_today: { type: integer, description: Calls with the key today, UTC }
        calls_30d:
          { type: integer, description: Calls with the key in the last 30 days, today included }
    KeyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Key" }
    NewKey:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: "#/components/schemas/Key" }
        secret:
          type: string
          description: The key itself. Shown only now; store it safely.
    Match:
      type: string
      description: |
        What the query matched (US-05): the headword (or, from English, the gloss), a
        spelling variant, the root of an inflected or prefixed form, or a similar spelling.
      enum: [headword, variant, root, similar]
    LookupHit:
      type: object
      required: [match, concept, entries]
      properties:
        match: { $ref: "#/components/schemas/Match" }
        concept:
          type: object
          required: [id, gloss_en]
          properties:
            id: { type: string, format: uuid }
            gloss_en: { type: string, example: water }
        entries:
          type: array
          description: Entries expressing the concept, each with only those senses
          items: { $ref: "#/components/schemas/EntrySummary" }
    LookupResults:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/LookupHit" }
    EntryHit:
      type: object
      required: [match, entry]
      properties:
        match: { $ref: "#/components/schemas/Match" }
        entry: { $ref: "#/components/schemas/EntrySummary" }
    EntrySearchResults:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/EntryHit" }
    ContributionInput:
      type: object
      additionalProperties: false
      required: [language, headword, part_of_speech, gloss_en, agree_to_licence]
      properties:
        language:
          type: string
          description: ISO 639-3 code of an active language
          pattern: "^[a-z]{3}$"
          example: bem
        headword:
          type: string
          minLength: 1
          maxLength: 100
          example: amenshi
        part_of_speech: { $ref: "#/components/schemas/PartOfSpeech" }
        noun_class:
          type: string
          description: Singular/plural class pair, for nouns
          pattern: "^[0-9]{1,2}(/[0-9]{1,2})?$"
          example: "6"
        gloss_en:
          type: string
          minLength: 1
          maxLength: 200
          example: water
        example:
          type: object
          additionalProperties: false
          required: [text, translation_en]
          properties:
            text: { type: string, minLength: 1, maxLength: 500 }
            translation_en: { type: string, minLength: 1, maxLength: 500 }
        corrects:
          type: string
          format: uuid
          description: |
            The meaning (sense ID) this contribution corrects, in the same language. The
            correction is reviewed like any contribution; the original stays served and keeps
            its history meanwhile.
        agree_to_licence:
          type: boolean
          description: The contributor agrees their contribution is published under the dataset licence
          enum: [true]
    Contribution:
      type: object
      required: [entry_id, sense_id, new_sense, trust]
      properties:
        entry_id: { type: string, format: uuid }
        sense_id: { type: string, format: uuid }
        example_id: { type: string, format: uuid }
        new_sense:
          type: boolean
          description: False when the word and meaning were already known; the contribution counts as agreement
        trust: { $ref: "#/components/schemas/Trust" }
    ReviewPriority:
      type: string
      description: "`quick`: every source agrees. `standard`: at least two agree. `full`: no agreement (AI-3)."
      enum: [quick, standard, full]
    ReviewCandidate:
      type: object
      required: [item_id, headword]
      properties:
        item_id:
          type: string
          format: uuid
          description: The candidate's item, a sense or, on a phrase card, a phrase
        headword:
          type: string
          description: The word, or on a phrase card the phrase
          example: amenshi
        notes:
          type: string
          description: On a phrase card, when to use this form
        part_of_speech:
          $ref: "#/components/schemas/PartOfSpeech"
          description: Absent when the source did not give one
        noun_class:
          type: string
          example: "6"
        plural:
          type: string
        corrects: { $ref: "#/components/schemas/CorrectedMeaning" }
    CorrectedMeaning:
      type: object
      description: The meaning a correction would replace; verifying the correction retires it
      required: [item_id, headword, gloss]
      properties:
        item_id: { type: string, format: uuid }
        headword: { type: string }
        gloss: { type: string }
    QualificationTest:
      type: object
      required: [id, language, questions]
      properties:
        id: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/LanguageCode" }
        questions:
          type: array
          items: { $ref: "#/components/schemas/QualificationQuestion" }
    QualificationQuestion:
      type: object
      required: [gloss_en, options]
      properties:
        gloss_en: { type: string, description: The English meaning }
        options:
          type: array
          description: Four words; one means gloss_en
          items: { $ref: "#/components/schemas/QualificationOption" }
    QualificationOption:
      type: object
      required: [id, headword]
      properties:
        id: { type: string, format: uuid }
        headword: { type: string }
    QualificationResult:
      type: object
      required: [id, score, total, pass_mark, passed]
      properties:
        id: { type: string, format: uuid }
        score: { type: integer }
        total: { type: integer }
        pass_mark: { type: integer, description: Right answers needed to pass }
        passed:
          type: boolean
          description: A senior reviewer of the language confirms a pass before you can review
    QualificationList:
      type: object
      required: [qualifications]
      properties:
        qualifications:
          type: array
          items: { $ref: "#/components/schemas/PendingQualification" }
    PendingQualification:
      type: object
      required: [id, user_id, name, language, score, total, answered_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string }
        name: { type: string }
        language: { $ref: "#/components/schemas/LanguageCode" }
        score: { type: integer }
        total: { type: integer }
        answered_at: { type: string, format: date-time }
    Clip:
      type: object
      description: A pronunciation recorded by a native speaker (LEX-8)
      required: [id, entry_id, url, content_type, recorded_at, mine]
      properties:
        id: { type: string, format: uuid }
        entry_id: { type: string, format: uuid }
        url:
          {
            type: string,
            description: Where to fetch the sound,
            relative to the API,
            example: /v1/audio/0b6c…,
          }
        content_type: { type: string, example: audio/webm }
        recorded_at: { type: string, format: date-time }
        mine: { type: boolean, description: Recorded by the signed-in caller, who may delete it }
    ClipList:
      type: object
      required: [data, can_record]
      properties:
        can_record:
          type: boolean
          description: The signed-in caller has consent in force that covers the entry's language
        data:
          type: array
          items: { $ref: "#/components/schemas/Clip" }
    Speaker:
      type: object
      description: A speaker's consent to be recorded
      required: [user_id, languages, consented_at]
      properties:
        user_id: { type: string }
        languages:
          type: array
          description: The languages the speaker may record
          items: { $ref: "#/components/schemas/LanguageCode" }
        consented_at: { type: string, format: date-time }
        withdrawn_at:
          type: string
          format: date-time
          description: Set once the speaker withdraws; they cannot record until a new form is recorded
    KeyUsage:
      type: object
      required: [key_id, name, prefix, limit_per_minute, days]
      properties:
        key_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        limit_per_minute:
          type: integer
          description: Calls a key may make per minute; 0 means unlimited
        days:
          type: array
          items: { $ref: "#/components/schemas/KeyUsageDay" }
    KeyUsageDay:
      type: object
      required: [day, calls, errors, limited]
      properties:
        day: { type: string, format: date }
        calls: { type: integer }
        errors: { type: integer, description: Calls answered with an error other than 429 }
        limited: { type: integer, description: Calls refused with 429 for going over the limit }
    Dispute:
      type: object
      required: [language, gloss_en, candidate, disputed_since, reviews]
      properties:
        language: { $ref: "#/components/schemas/LanguageCode" }
        gloss_en: { type: string }
        candidate: { $ref: "#/components/schemas/ReviewCandidate" }
        disputed_since:
          type: string
          format: date-time
          description: When the last counted review was made
        reviews:
          type: array
          description: Oldest first. Reviewers stay anonymous.
          items: { $ref: "#/components/schemas/DisputeReview" }
    DisputeReview:
      type: object
      required: [decision, comment, created_at]
      properties:
        decision: { $ref: "#/components/schemas/ReviewDecision" }
        comment: { type: string }
        correction:
          type: string
          description: The word the reviewer wrote instead, for `correct` decisions
        created_at: { type: string, format: date-time }
    DisputeList:
      type: object
      required: [disputes]
      properties:
        disputes:
          type: array
          items: { $ref: "#/components/schemas/Dispute" }
    ResolutionOutcome:
      type: string
      enum: [keep, send_back]
    ResolutionInput:
      type: object
      additionalProperties: false
      required: [outcome, note]
      properties:
        outcome: { $ref: "#/components/schemas/ResolutionOutcome" }
        note: { type: string, minLength: 1, maxLength: 1000 }
    Resolution:
      type: object
      required: [item_id, outcome, status]
      properties:
        item_id: { type: string, format: uuid }
        outcome: { $ref: "#/components/schemas/ResolutionOutcome" }
        status: { $ref: "#/components/schemas/TrustStatus" }
    ReviewCard:
      type: object
      required: [language, concept_id, gloss_en, priority, kind, candidates]
      properties:
        language: { $ref: "#/components/schemas/LanguageCode" }
        kind:
          type: string
          description: |
            `sense`: candidate words for the meaning. `phrase`: candidate phrases for a line
            of a phrase pack, whose English is `gloss_en`. A card never mixes them.
          enum: [sense, phrase]
        concept_id: { type: string, format: uuid }
        gloss_en:
          type: string
          example: water
        priority: { $ref: "#/components/schemas/ReviewPriority" }
        candidates:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReviewCandidate" }
    ReviewDecision:
      type: string
      description: "`correct`: none of the candidates is right, and the reviewer writes the right word in `correction`."
      enum: [accept, reject, correct]
    ReviewInput:
      type: object
      additionalProperties: false
      required: [decisions]
      properties:
        decisions:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [item_id, decision]
            properties:
              item_id: { type: string, format: uuid }
              decision: { $ref: "#/components/schemas/ReviewDecision" }
        comment:
          type: string
          maxLength: 500
          description: Why, for rejections
        correction:
          type: object
          additionalProperties: false
          description: |
            The reviewer's own word for the card's meaning, or on a phrase card their own
            phrase, required with `correct` decisions. It becomes a new candidate that other
            reviewers check; the candidates it replaces keep their history (US-22).
          required: [headword]
          properties:
            headword: { type: string, minLength: 1, maxLength: 200 }
            part_of_speech: { $ref: "#/components/schemas/PartOfSpeech" }
            noun_class:
              type: string
              pattern: "^[0-9]{1,2}(/[0-9]{1,2})?$"
    Review:
      type: object
      required: [id, item_id, decision]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        decision: { $ref: "#/components/schemas/ReviewDecision" }
        correction_item_id:
          type: string
          format: uuid
          description: The new candidate a correction created
    ReviewList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Review" }
    TrustStatus:
      type: string
      description: |
        How far an item has been checked (ADR-0004). Only `verified` is returned by default;
        `disputed` is never returned.
      enum: [verified, reviewed, sourced, machine, disputed]
    SourceRef:
      type: object
      required: [name, licence]
      properties:
        name:
          type: string
          example: GATITOS
        licence:
          type: string
          example: CC BY 4.0
        url:
          type: string
          format: uri
        reference:
          type: string
          description: Page, line or row in the source
        model:
          type: string
          description: Model version, present only for machine-generated items
          example: claude-opus-5-5
    ReviewSummary:
      type: object
      description: Counts only. Reviewer identities are not exposed per item.
      required: [accepts, corrections]
      properties:
        accepts:
          type: integer
          minimum: 0
        corrections:
          type: integer
          minimum: 0
        last_reviewed_at:
          type: string
          format: date-time
    Trust:
      type: object
      description: |
        Provenance carried by every item (PRV-1). Item schemas include it as a `trust`
        property; never copy these fields into an item schema.
      required: [status, sources, reviews]
      properties:
        status: { $ref: "#/components/schemas/TrustStatus" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        reviews: { $ref: "#/components/schemas/ReviewSummary" }
        release:
          type: string
          description: Dataset release the item belongs to, absent until first released
          pattern: "^[0-9]{4}\\.[0-9]+$"
          example: "2027.1"
    ErrorCode:
      type: string
      description: |
        Stable machine-readable code. Codes are never renamed; new codes may be added,
        so treat unknown values as a generic error.
      enum:
        [
          bad_request,
          unauthorized,
          forbidden,
          not_found,
          method_not_allowed,
          conflict,
          payload_too_large,
          rate_limited,
          internal,
          unavailable,
        ]
      example: not_found
    Error:
      type: object
      required: [code, message, docs_url]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          example: Entry not found
        docs_url:
          type: string
          format: uri
