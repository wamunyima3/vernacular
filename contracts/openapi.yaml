openapi: 3.0.3
info:
  title: Vernacular API
  version: 0.1.0
  summary: Verified words, phrases and translations for Zambian languages.
  description: |
    Every item the API returns says where it came from and who checked it.
    Only items accepted by two independent native-speaker reviewers are `verified`,
    and only verified items are returned by default.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: system
  - name: languages
  - name: accounts
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database readiness
      tags: [system]
      responses:
        "200":
          description: Service and database are reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          $ref: "#/components/responses/Error"
  /v1/languages:
    get:
      operationId: listLanguages
      summary: Supported and planned languages
      description: Languages in rollout order. `status` is `active` once the language serves data.
      tags: [languages]
      responses:
        "200":
          description: All languages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageList" }
        default:
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in user, with role and review approvals
      description: Used by the web tools. Requires a session token from sign-in.
      tags: [accounts]
      security:
        - session: []
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: Session token from signing in to the web app (ADR-0007).
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    LanguageCode:
      type: string
      description: ISO 639-3 code
      pattern: "^[a-z]{3}$"
      example: bem
    Language:
      type: object
      required: [code, name, own_name, wave, status]
      properties:
        code: { $ref: "#/components/schemas/LanguageCode" }
        name:
          type: string
          description: English name
          example: Bemba
        own_name:
          type: string
          description: Name of the language in the language itself
          example: Ichibemba
        wave:
          type: integer
          description: Rollout wave from the delivery plan
          minimum: 1
          example: 1
        status:
          type: string
          enum: [active, planned]
    LanguageList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Language" }
    Role:
      type: string
      description: Global account role. Review rights are per language, in `approvals`.
      enum: [developer, contributor, admin]
    ReviewerLevel:
      type: string
      enum: [reviewer, senior]
    Approval:
      type: object
      required: [language, level]
      properties:
        language: { $ref: "#/components/schemas/LanguageCode" }
        level: { $ref: "#/components/schemas/ReviewerLevel" }
    Me:
      type: object
      required: [id, name, email, role, approvals]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role: { $ref: "#/components/schemas/Role" }
        approvals:
          type: array
          items: { $ref: "#/components/schemas/Approval" }
    TrustStatus:
      type: string
      description: |
        How far an item has been checked (ADR-0004). Only `verified` is returned by default;
        `disputed` is never returned.
      enum: [verified, reviewed, sourced, machine, disputed]
    SourceRef:
      type: object
      required: [name, licence]
      properties:
        name:
          type: string
          example: GATITOS
        licence:
          type: string
          example: CC BY 4.0
        url:
          type: string
          format: uri
        reference:
          type: string
          description: Page, line or row in the source
        model:
          type: string
          description: Model version, present only for machine-generated items
          example: claude-opus-5-5
    ReviewSummary:
      type: object
      description: Counts only. Reviewer identities are not exposed per item.
      required: [accepts, corrections]
      properties:
        accepts:
          type: integer
          minimum: 0
        corrections:
          type: integer
          minimum: 0
        last_reviewed_at:
          type: string
          format: date-time
    Trust:
      type: object
      description: |
        Provenance carried by every item (PRV-1). Item schemas include it as a `trust`
        property; never copy these fields into an item schema.
      required: [status, sources, reviews]
      properties:
        status: { $ref: "#/components/schemas/TrustStatus" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        reviews: { $ref: "#/components/schemas/ReviewSummary" }
        release:
          type: string
          description: Dataset release the item belongs to, absent until first released
          pattern: "^[0-9]{4}\\.[0-9]+$"
          example: "2027.1"
    ErrorCode:
      type: string
      description: |
        Stable machine-readable code. Codes are never renamed; new codes may be added,
        so treat unknown values as a generic error.
      enum:
        [
          bad_request,
          unauthorized,
          forbidden,
          not_found,
          method_not_allowed,
          rate_limited,
          internal,
          unavailable,
        ]
      example: not_found
    Error:
      type: object
      required: [code, message, docs_url]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          example: Entry not found
        docs_url:
          type: string
          format: uri
